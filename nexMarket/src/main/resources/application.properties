spring.application.name=nexMarket
server.port=${SERVER_PORT:8080}

# MySQL Configuration (Auto-generación de tablas relacionales)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexmarket_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Auto Schema Generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MongoDB Configuration (Auditoría NoSQL)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nexmarket_audit_db}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nexmarket_audit_db}

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:TDEATDEATDEATDEATDEATDEATDEATDEA}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
FRONTEND_ORIGIN=${FRONTEND_ORIGIN:http://localhost:5173}
